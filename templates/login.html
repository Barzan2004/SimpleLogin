 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SimpleLogin | Sign In</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: radial-gradient(
                circle at top,
                #14291D,
                #080C09 65%
            );
        }

        .login-container {
            width: 100%;
            max-width: 400px;
            padding: 40px 32px;
            background: #101512;
            border: 1px solid #1D402D;
            border-radius: 18px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
        }

        .logo {
            width: 65px;
            height: 65px;
            margin: 0 auto 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 16px;
            background: #16834A;
            color: #FFFFFF;
            font-size: 28px;
            font-weight: bold;
            box-shadow: 0 0 22px rgba(22, 131, 74, 0.20);
        }

        h1 {
            text-align: center;
            color: #F0F5F1;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #94A99A;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #C6D4CA;
            font-size: 14px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #30483A;
            border-radius: 9px;
            background: #090D0B;
            color: #F0F5F1;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input::placeholder {
            color: #718176;
        }

        input:focus {
            border-color: #16834A;
            box-shadow: 0 0 0 3px rgba(22, 131, 74, 0.18);
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 9px;
            background: #16834A;
            color: #FFFFFF;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s, box-shadow 0.2s;
        }

        button:hover {
            background: #1B9958;
            box-shadow: 0 0 18px rgba(22, 131, 74, 0.20);
        }

        .message {
            margin-top: 20px;
            text-align: center;
            color: #39A96B;
            font-size: 14px;
            line-height: 1.6;
            overflow-wrap: anywhere;
        }

        .footer {
            margin-top: 28px;
            text-align: center;
            color: #718176;
            font-size: 12px;
        }

        @media (max-width: 420px) {
            .login-container {
                padding: 32px 24px;
            }
        }
    </style>
</head>

<body>
    <main class="login-container">

        <div class="logo">S</div>

        <h1>Welcome Back</h1>

        <p class="subtitle">
            Sign in to continue to your account
        </p>

        <form method="POST" action="/">

            <div class="input-group">
                <label for="username">Username</label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter your username"
                    autocomplete="username"
                    required
                >
            </div>
 <div class="input-group">
                <label for="password">Password</label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >
            </div>

            <button type="submit">Sign In</button>

        </form>

        <p class="message">{{.}}</p>

        <div class="footer">
            SimpleLogin · Student Project
        </div>

    </main>
</body>
</html>
